name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[package,racebox-download]"
          python -m pip install pyinstaller

      - name: Build (Windows portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/build_windows_portable.py
          $zip = "OpenLap-${{ github.ref_name }}-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/OpenLap" -DestinationPath $zip
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Build (macOS .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m PyInstaller OpenLap.spec --clean -y
          python tools/stage_dist_tracks.py dist/OpenLap.app
          ZIP="OpenLap-${{ github.ref_name }}-macos.zip"
          rm -f "$ZIP"
          # Keep parent dir so users get OpenLap.app at top-level when unzipped
          ditto -c -k --sequesterRsrc --keepParent "dist/OpenLap.app" "$ZIP"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
